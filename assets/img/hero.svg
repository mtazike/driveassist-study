<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="A silver SUV driving on a multi-lane highway at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a36"/>
      <stop offset="0.45" stop-color="#46596a"/>
      <stop offset="0.78" stop-color="#b9a68c"/>
      <stop offset="1" stop-color="#e2cfae"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5159"/>
      <stop offset="1" stop-color="#22272c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d0d6"/>
      <stop offset="0.55" stop-color="#9aa4ad"/>
      <stop offset="1" stop-color="#6c767f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4b5a"/>
      <stop offset="1" stop-color="#18222b"/>
    </linearGradient>
    <linearGradient id="laneGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fd0d6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7fd0d6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="640" fill="url(#sky)"/>
  <circle cx="1060" cy="300" r="170" fill="url(#sun)"/>

  <!-- distant hills -->
  <path d="M0 312 C 180 282 300 292 420 302 C 560 314 640 290 780 294 C 920 298 1010 312 1140 306 C 1290 298 1420 284 1600 296 L1600 340 L0 340 Z" fill="#5d6a73" opacity="0.55"/>
  <path d="M0 318 C 220 292 380 312 560 316 C 720 320 860 300 1010 310 C 1180 322 1380 300 1600 312 L1600 360 L0 360 Z" fill="#3c4851"/>

  <!-- tree lines -->
  <path d="M0 336 L0 318 Q20 300 40 316 Q62 296 86 314 Q110 292 136 312 Q160 298 186 314 Q214 296 240 316 Q270 302 300 318 Q330 306 360 322 Q420 314 480 326 Q560 320 640 328 L700 330 L0 340 Z" fill="#26322c"/>
  <path d="M1600 336 L1600 316 Q1580 300 1556 314 Q1534 296 1508 314 Q1484 294 1456 312 Q1430 300 1404 316 Q1376 298 1348 318 Q1318 304 1288 320 Q1240 312 1180 324 Q1100 320 1000 328 L900 330 L1600 340 Z" fill="#26322c"/>
  <!-- ground beside road -->
  <rect y="330" width="1600" height="310" fill="#2f3a35"/>
  <path d="M0 330 L1600 330 L1600 640 L0 640 Z" fill="#3a463f" opacity="0.6"/>

  <!-- road surface (vanishing point ~ 800,330) -->
  <path d="M760 330 L840 330 L1600 640 L0 640 Z" fill="url(#road)"/>

  <!-- road edge lines -->
  <path d="M762 330 L30 640" stroke="#e9e4d8" stroke-width="5" opacity="0.85"/>
  <path d="M838 330 L1570 640" stroke="#e9e4d8" stroke-width="5" opacity="0.85"/>

  <!-- lane glow (current lane) -->
  <path d="M790 332 L812 332 L1010 640 L585 640 Z" fill="url(#laneGlow)"/>

  <!-- dashed lane dividers -->
  <g stroke="#f2efe6" stroke-linecap="butt">
    <!-- left divider: from (787,330) to (520,640) -->
    <line x1="784" y1="345" x2="779" y2="352" stroke-width="2"/>
    <line x1="773" y1="366" x2="765" y2="378" stroke-width="3"/>
    <line x1="752" y1="400" x2="738" y2="420" stroke-width="4"/>
    <line x1="716" y1="452" x2="693" y2="486" stroke-width="5"/>
    <line x1="655" y1="540" x2="618" y2="594" stroke-width="7"/>
    <line x1="586" y1="615" x2="566" y2="640" stroke-width="8"/>
    <!-- right divider: from (813,330) to (1080,640) -->
    <line x1="816" y1="345" x2="821" y2="352" stroke-width="2"/>
    <line x1="827" y1="366" x2="835" y2="378" stroke-width="3"/>
    <line x1="848" y1="400" x2="862" y2="420" stroke-width="4"/>
    <line x1="884" y1="452" x2="907" y2="486" stroke-width="5"/>
    <line x1="945" y1="540" x2="982" y2="594" stroke-width="7"/>
    <line x1="1014" y1="615" x2="1034" y2="640" stroke-width="8"/>
  </g>

  <!-- guardrail left -->
  <path d="M760 326 L0 455" stroke="#8f979c" stroke-width="3" opacity="0.7"/>
  <path d="M760 330 L0 470" stroke="#5f676c" stroke-width="2" opacity="0.6"/>

  <!-- distant vehicle -->
  <g transform="translate(828 352)">
    <rect x="-9" y="-7" width="18" height="10" rx="2" fill="#2a3138"/>
    <rect x="-8" y="0" width="3" height="1.6" fill="#d9534f"/>
    <rect x="5" y="0" width="3" height="1.6" fill="#d9534f"/>
  </g>

  <!-- ego vehicle: generic SUV, rear view -->
  <g transform="translate(800 540) scale(0.7)">
    <ellipse cx="0" cy="92" rx="190" ry="20" fill="#0d1115" opacity="0.55" filter="url(#soft)"/>
    <!-- wheels -->
    <rect x="-168" y="40" width="46" height="56" rx="8" fill="#111518"/>
    <rect x="122" y="40" width="46" height="56" rx="8" fill="#111518"/>
    <!-- lower body -->
    <path d="M-178 -8 Q-182 -30 -160 -40 L160 -40 Q182 -30 178 -8 L174 62 Q172 76 156 76 L-156 76 Q-172 76 -174 62 Z" fill="url(#body)"/>
    <!-- cabin / roof -->
    <path d="M-140 -40 L-118 -112 Q-112 -126 -96 -126 L96 -126 Q112 -126 118 -112 L140 -40 Z" fill="#aeb7bf"/>
    <path d="M-124 -46 L-106 -106 Q-102 -114 -92 -114 L92 -114 Q102 -114 106 -106 L124 -46 Z" fill="url(#glass)"/>
    <!-- roof rails -->
    <rect x="-100" y="-131" width="200" height="5" rx="2.5" fill="#5d666e"/>
    <!-- tail lights -->
    <path d="M-170 -24 L-112 -24 L-116 -8 L-172 -8 Z" fill="#b8312f"/>
    <path d="M170 -24 L112 -24 L116 -8 L172 -8 Z" fill="#b8312f"/>
    <path d="M-168 -21 L-118 -21" stroke="#ff8a7a" stroke-width="2" opacity="0.8"/>
    <path d="M168 -21 L118 -21" stroke="#ff8a7a" stroke-width="2" opacity="0.8"/>
    <!-- tailgate seam and plate -->
    <path d="M-108 -32 L108 -32" stroke="#7d878f" stroke-width="2"/>
    <rect x="-44" y="6" width="88" height="26" rx="3" fill="#dfe3e6"/>
    <!-- bumper -->
    <path d="M-170 46 L170 46 L166 70 Q164 74 156 74 L-156 74 Q-164 74 -166 70 Z" fill="#4b545c"/>
    <!-- mirrors -->
    <path d="M-150 -52 L-178 -60 L-182 -44 L-152 -42 Z" fill="#8c969f"/>
    <path d="M150 -52 L178 -60 L182 -44 L152 -42 Z" fill="#8c969f"/>
  </g>
</svg>
